<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>15 August | India</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:white;
    height:100vh;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   MAIN SCREEN
========================= */

.hero{
    height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
}

/* =========================
   TRICOLOR
========================= */

.flag{
    width:min(75vw,850px);
    height:min(50vw,500px);

    position:absolute;

    display:flex;
    flex-direction:column;

    opacity:0;

    transform:
        perspective(1000px)
        rotateX(8deg)
        scale(.82);

    filter:
        drop-shadow(0 0 35px rgba(255,255,255,.08));

    animation:
        flagReveal 2s ease-out forwards;

    animation-delay:1s;
}

/* Three colours */

.saffron,
.white,
.green{
    width:100%;
    height:33.333%;
    transform:scaleX(0);
    transform-origin:left;
}

/* Saffron */

.saffron{
    background:linear-gradient(
        90deg,
        #ff7a00,
        #ff9933,
        #ffb15c
    );

    animation:
        reveal 2.2s cubic-bezier(.16,1,.3,1) forwards;

    animation-delay:1.5s;
}

/* White */

.white{
    background:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    animation:
        reveal 2.2s cubic-bezier(.16,1,.3,1) forwards;

    animation-delay:3s;
}

/* Green */

.green{
    background:linear-gradient(
        90deg,
        #087f23,
        #138808,
        #21a33a
    );

    animation:
        reveal 2.2s cubic-bezier(.16,1,.3,1) forwards;

    animation-delay:4.5s;
}


/* =========================
   ASHOKA CHAKRA
========================= */

.chakra{
    width:clamp(55px,9vw,100px);
    aspect-ratio:1;

    border:4px solid #000080;
    border-radius:50%;

    position:relative;

    opacity:0;
    transform:scale(.3);

    animation:
        chakraAppear 1.5s cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:5.8s;
}

/* Chakra center */

.chakra::after{
    content:"";

    position:absolute;

    width:12%;
    height:12%;

    background:#000080;

    border-radius:50%;

    left:44%;
    top:44%;
}

/* Chakra spokes */

.spoke{
    position:absolute;

    width:3px;
    height:92%;

    background:#000080;

    left:50%;
    top:4%;

    transform-origin:center;
}

.spoke:nth-child(1){transform:rotate(0deg)}
.spoke:nth-child(2){transform:rotate(15deg)}
.spoke:nth-child(3){transform:rotate(30deg)}
.spoke:nth-child(4){transform:rotate(45deg)}
.spoke:nth-child(5){transform:rotate(60deg)}
.spoke:nth-child(6){transform:rotate(75deg)}
.spoke:nth-child(7){transform:rotate(90deg)}
.spoke:nth-child(8){transform:rotate(105deg)}
.spoke:nth-child(9){transform:rotate(120deg)}
.spoke:nth-child(10){transform:rotate(135deg)}
.spoke:nth-child(11){transform:rotate(150deg)}
.spoke:nth-child(12){transform:rotate(165deg)}


/* =========================
   TEXT
========================= */

.content{
    position:absolute;

    z-index:10;

    text-align:center;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:100%;

    pointer-events:none;
}

.small{
    font-size:14px;

    letter-spacing:8px;

    color:#aaa;

    opacity:0;

    animation:
        fadeUp 1.2s ease forwards;

    animation-delay:6.8s;
}

h1{
    margin-top:18px;

    font-size:
        clamp(35px,7vw,85px);

    font-weight:800;

    letter-spacing:4px;

    opacity:0;

    background:
        linear-gradient(
            90deg,
            #ff9933,
            #fff,
            #138808
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleReveal 1.8s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:7.2s;
}

.subtitle{
    margin-top:20px;

    font-size:
        clamp(14px,2vw,21px);

    letter-spacing:6px;

    color:#ddd;

    opacity:0;

    animation:
        fadeUp 1.3s ease forwards;

    animation-delay:8s;
}


/* =========================
   GLOW LINE
========================= */

.line{
    width:0;
    height:1px;

    margin:25px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff9933,
            white,
            #138808,
            transparent
        );

    box-shadow:
        0 0 15px rgba(255,255,255,.5);

    animation:
        lineReveal 1.5s ease forwards;

    animation-delay:8.5s;
}


/* =========================
   PARTICLES
========================= */

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    opacity:0;

    animation:
        particleFloat linear infinite;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes reveal{

    0%{
        transform:scaleX(0);
    }

    100%{
        transform:scaleX(1);
    }

}

@keyframes flagReveal{

    0%{
        opacity:0;

        transform:
            perspective(1000px)
            rotateX(15deg)
            scale(.82);
    }

    100%{
        opacity:1;

        transform:
            perspective(1000px)
            rotateX(0deg)
            scale(1);
    }

}

@keyframes chakraAppear{

    0%{
        opacity:0;
        transform:scale(.2) rotate(-180deg);
    }

    100%{
        opacity:1;
        transform:scale(1) rotate(0deg);
    }

}

@keyframes fadeUp{

    0%{
        opacity:0;
        transform:translateY(20px);
    }

    100%{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes titleReveal{

    0%{
        opacity:0;
        letter-spacing:25px;
        transform:scale(.8);
    }

    100%{
        opacity:1;
        letter-spacing:4px;
        transform:scale(1);
    }

}

@keyframes lineReveal{

    from{
        width:0;
    }

    to{
        width:300px;
    }

}

@keyframes particleFloat{

    0%{
        transform:translateY(100vh);
        opacity:0;
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.7;
    }

    100%{
        transform:translateY(-10vh);
        opacity:0;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .flag{
        width:88vw;
        height:58vw;
    }

    h1{
        letter-spacing:2px;
    }

    .subtitle{
        letter-spacing:3px;
    }

}

</style>
</head>

<body>

<div class="hero">

    <!-- PREMIUM PARTICLES -->
    <div class="particle" style="left:8%;animation-duration:9s"></div>
    <div class="particle" style="left:18%;animation-duration:12s;animation-delay:2s"></div>
    <div class="particle" style="left:32%;animation-duration:10s;animation-delay:4s"></div>
    <div class="particle" style="left:48%;animation-duration:14s;animation-delay:1s"></div>
    <div class="particle" style="left:63%;animation-duration:11s;animation-delay:3s"></div>
    <div class="particle" style="left:78%;animation-duration:13s;animation-delay:5s"></div>
    <div class="particle" style="left:91%;animation-duration:10s;animation-delay:2s"></div>


    <!-- FLAG -->

    <div class="flag">

        <div class="saffron"></div>

        <div class="white">

            <div class="chakra">

                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>
                <span class="spoke"></span>

            </div>

        </div>

        <div class="green"></div>

    </div>


    <!-- TEXT -->

    <div class="content">

        <div class="small">
            15 • AUGUST • 1947
        </div>

        <h1>
            HAPPY INDEPENDENCE DAY
        </h1>

        <div class="subtitle">
            ONE NATION • ONE PRIDE • ONE INDIA
        </div>

        <div class="line"></div>

    </div>

</div>

</body>
</html>
